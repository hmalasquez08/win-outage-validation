[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "win-outage-validation"
version = "0.1.0"
description = "Local, evidence-first validation of Peru outage data sources"
requires-python = ">=3.11"
dependencies = ["websockets>=12,<16", "certifi>=2024.2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
