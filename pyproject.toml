[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "win-outage-validation"
version = "0.1.0"
description = "Manual live outage trigger for Peru network operators"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["certifi>=2024.2.2", "xmlschema>=3.4,<5"]

[project.scripts]
win-outage-live = "win_validation.live_runner:main"
win-prueba-lima = "win_validation.prueba_lima:main"

[tool.setuptools.packages.find]
where = ["src"]
